<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>食刻搜 · 数据预览</title>
<style>
  :root{
    --bg:#faf7f2; --card:#fff; --line:#ece4d8; --ink:#2c2620; --sub:#8a7f72;
    --red:#c8452d; --amber:#b7791f; --shadow:0 1px 3px rgba(60,40,20,.07);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  header{padding:28px 32px 18px;border-bottom:1px solid var(--line);background:#fff}
  h1{margin:0 0 6px;font-size:21px;letter-spacing:.5px}
  h1 span{color:var(--red)}
  .sub{color:var(--sub);font-size:13px}
  .stats{display:flex;gap:28px;margin-top:16px;flex-wrap:wrap}
  .stat b{display:block;font-size:20px;color:var(--red);font-weight:600}
  .stat i{font-style:normal;font-size:12px;color:var(--sub)}
  nav{display:flex;gap:4px;padding:14px 32px;background:#fff;border-bottom:1px solid var(--line);
      position:sticky;top:0;z-index:5;flex-wrap:wrap}
  nav button{border:0;background:transparent;padding:8px 16px;border-radius:8px;cursor:pointer;
             font-size:14px;color:var(--sub);font-family:inherit}
  nav button.on{background:#fdf0ea;color:var(--red);font-weight:600}
  .bar{padding:14px 32px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  input[type=search]{flex:1;min-width:220px;padding:9px 14px;border:1px solid var(--line);
        border-radius:9px;font-size:14px;font-family:inherit;background:#fff;outline:none}
  input[type=search]:focus{border-color:#e0c3b6}
  .hint{color:var(--sub);font-size:12px}
  main{padding:18px 32px 60px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
        box-shadow:var(--shadow);cursor:pointer;transition:.16s;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(60,40,20,.12);border-color:#e3d3c4}
  .card .pic{aspect-ratio:4/3;background:#f3ece2;overflow:hidden;position:relative}
  .card .pic img{width:100%;height:100%;object-fit:cover;display:block}
  .rank{position:absolute;left:8px;top:8px;background:rgba(200,69,45,.92);color:#fff;
        font-size:11px;padding:2px 7px;border-radius:20px}
  .card .body{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column;gap:4px}
  .card .nm{font-weight:600;font-size:14px;line-height:1.35;
            display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta{color:var(--sub);font-size:12px;display:flex;gap:8px;flex-wrap:wrap}
  .tag{background:#f6f1e8;color:#8a6a45;border-radius:5px;padding:1px 6px;font-size:11px}
  .fav{color:var(--red);font-weight:600;font-size:12px}
  .price{color:var(--red);font-weight:600}
  .empty{padding:60px;text-align:center;color:var(--sub)}
  /* modal */
  .mask{position:fixed;inset:0;background:rgba(30,22,16,.5);display:none;
        align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
  .mask.on{display:flex}
  .modal{background:#fff;border-radius:14px;max-width:760px;width:100%;overflow:hidden;
         box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal .head{display:flex;gap:18px;padding:20px 22px;border-bottom:1px solid var(--line)}
  .modal .head img{width:180px;height:135px;object-fit:cover;border-radius:10px;background:#f3ece2}
  .modal h2{margin:0 0 8px;font-size:19px}
  .modal .close{margin-left:auto;border:0;background:#f6f1e8;width:30px;height:30px;
                border-radius:8px;cursor:pointer;font-size:16px;color:var(--sub);flex:0 0 auto}
  .modal .sec{padding:16px 22px;border-bottom:1px solid var(--line)}
  .modal .sec:last-child{border:0}
  .modal h3{margin:0 0 10px;font-size:13px;color:var(--sub);font-weight:600;letter-spacing:1px}
  .ing{display:flex;flex-wrap:wrap;gap:8px}
  .ing span{background:#f8f4ec;border-radius:6px;padding:4px 10px;font-size:13px}
  .steps{margin:0;padding-left:20px;color:#3b332b}
  .steps li{margin-bottom:6px}
  .ad{display:flex;gap:14px;align-items:center;background:#fffaf3;border:1px dashed #e6d3bd;
      border-radius:10px;padding:12px}
  .ad img{width:84px;height:84px;object-fit:contain;background:#fff;border-radius:8px}
  .ad .t{font-size:12px;color:var(--amber);margin-bottom:2px}
  .ad .n{font-weight:600;font-size:13px;margin-bottom:4px}
</style>
</head>
<body>
<header>
  <h1>食刻搜 · <span>数据预览</span></h1>
  <div class="sub">本地 webdata 校验页 · 图片、字段、广告位匹配都走真实数据</div>
  <div class="stats">
    <div class="stat"><b id="s1">–</b><i>菜谱</i></div>
    <div class="stat"><b id="s2">–</b><i>热搜去重</i></div>
    <div class="stat"><b id="s3">–</b><i>专题菜</i></div>
    <div class="stat"><b id="s4">–</b><i>厨具</i></div>
  </div>
</header>

<nav>
  <button class="on" data-v="list">搜索列表</button>
  <button data-v="hot">热搜排行</button>
  <button data-v="topic">专题</button>
  <button data-v="kitchen">厨具广告位</button>
</nav>

<div class="bar">
  <input type="search" id="q" placeholder="搜菜名或分类，例如 红烧肉 / 汤羹">
  <span class="hint" id="hint">加载中…</span>
</div>

<main><div class="grid" id="grid"></div><div class="empty" id="empty" style="display:none">没有匹配结果</div></main>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>

<script>
// ---------- CSV 解析（支持引号内逗号/换行） ----------
function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    } else {
      if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c!=='\r') cur+=c;
    }
  }
  if(cur||row.length){ row.push(cur); rows.push(row); }
  const head=rows.shift().map(s=>s.trim());
  return rows.filter(r=>r.length>1).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??'').trim()])));
}
const ridOf = url => (url.match(/recipe-(\d+)\.html/)||[])[1] || '';

const state={list:[],hot:[],topic:[],kitchen:[],view:'list',shards:{}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load(){
  const [a,b,c,d]=await Promise.all([
    fetch('list.csv').then(r=>r.text()),
    fetch('hot_rank_top.csv').then(r=>r.text()),
    fetch('topics.csv').then(r=>r.text()),
    fetch('kitchenware.csv').then(r=>r.text()),
  ]);
  state.list=parseCSV(a); state.hot=parseCSV(b);
  state.topic=parseCSV(c); state.kitchen=parseCSV(d);
  $('s1').textContent=state.list.length.toLocaleString();
  $('s2').textContent=state.hot.length.toLocaleString();
  $('s3').textContent=state.topic.length.toLocaleString();
  $('s4').textContent=state.kitchen.length.toLocaleString();
  render();
}

function render(){
  const q=$('q').value.trim();
  const g=$('grid'); let html='', data=[];
  if(state.view==='list'){
    data = q? state.list.filter(r=>r.菜名.includes(q)||r.分类.includes(q)) : state.list;
    $('hint').textContent=`${data.length.toLocaleString()} 条${q?'（已筛选）':''}，显示前 120 条`;
    html = data.slice(0,120).map(r=>`
      <div class="card" data-rid="${r.菜谱ID}">
        <div class="pic"><img loading="lazy" src="${esc(r.图片)}" alt=""></div>
        <div class="body">
          <div class="nm">${esc(r.菜名)}</div>
          <div class="meta"><span class="tag">${esc(r.分类)}</span>
            <span>${esc(r.耗时||'—')}</span><span>${esc(r['热量(大卡)']||'—')} 大卡</span></div>
        </div>
      </div>`).join('');
  } else if(state.view==='hot'){
    data = q? state.hot.filter(r=>r.菜名.includes(q)||r.分类.includes(q)) : state.hot;
    $('hint').textContent=`${data.length.toLocaleString()} 条，按收藏数排序`;
    html = data.slice(0,120).map((r,i)=>`
      <div class="card" data-rid="${ridOf(r.详情链接)}">
        <div class="pic"><span class="rank">${i+1}</span><img loading="lazy" src="${esc(r.封面图)}" alt=""></div>
        <div class="body">
          <div class="nm">${esc(r.菜名)}</div>
          <div class="meta"><span class="fav">♥ ${Number(r.收藏数).toLocaleString()}</span>
            <span class="tag">${esc(r.分类)}</span></div>
          <div class="meta"><span>${esc(r.所属榜单)}</span></div>
        </div>
      </div>`).join('');
  } else if(state.view==='topic'){
    data = q? state.topic.filter(r=>r.菜名.includes(q)||r.专题.includes(q)) : state.topic;
    $('hint').textContent=`${data.length.toLocaleString()} 行，${new Set(data.map(r=>r.专题)).size} 个专题`;
    html = data.slice(0,120).map(r=>`
      <div class="card" data-rid="${r.菜谱ID}">
        <div class="pic"><img loading="lazy" src="${esc(r.封面)}" alt=""></div>
        <div class="body">
          <div class="nm">${esc(r.菜名)}</div>
          <div class="meta"><span class="tag">${esc(r.专区)}</span><span class="tag">${esc(r.分类||'—')}</span></div>
          <div class="meta"><span>${esc(r.专题)}</span></div>
        </div>
      </div>`).join('');
  } else {
    data = state.kitchen;
    $('hint').textContent=`${data.length} 件厨具，前 120 件（有评论优先）`;
    html = data.slice(0,120).map(r=>`
      <div class="card" data-kw="${esc(r.厨具ID)}">
        <div class="pic"><img loading="lazy" src="${esc(r.封面图)}" alt=""></div>
        <div class="body">
          <div class="nm">${esc(r.名称).slice(0,42)}</div>
          <div class="meta"><span class="price">¥${esc(r['价格(元)'])}</span>
            <span class="tag">${esc(r.品类)}</span></div>
          <div class="meta"><span>${r.评论数? r.评论数+' 条评价':'—'}</span></div>
        </div>
      </div>`).join('');
  }
  g.innerHTML=html;
  $('empty').style.display = data.length? 'none':'block';
}

// ---------- 详情弹窗 ----------
async function openRid(rid){
  if(!rid) return;
  const k=rid.slice(-1);
  if(!state.shards[k]) state.shards[k]=await fetch(`detail/${k}.json`).then(r=>r.json());
  const d=state.shards[k][rid];
  if(!d){ alert('这个 ID 没有详情：'+rid); return; }
  const craft=(d.feat||'').split(' · ')[1] || '';
  const ad = state.kitchen.find(x=>x.投放标签.includes(craft)||x.投放标签.includes(d.cat))
          || state.kitchen.find(x=>x.投放标签.includes('通用'));
  const ings=(d.ing||'').split('|').map(s=>s.trim()).filter(Boolean);
  const steps=(d.steps||'').split('\n').map(s=>s.replace(/^\d+[.、]\s*/,'').trim()).filter(Boolean);
  $('modal').innerHTML=`
    <div class="head">
      <img src="${esc(d.img)}" alt="">
      <div style="flex:1;min-width:0">
        <h2>${esc(d.name)}</h2>
        <div class="meta"><span class="tag">${esc(d.cat)}</span>
          <span class="tag">${esc(d.feat||'—')}</span>
          <span>${esc(d.time||'—')}</span><span>${esc(d.heat||'—')} 大卡</span></div>
        <div class="meta" style="margin-top:6px"><a href="${esc(d.url)}" target="_blank" style="color:#c8452d">原站页面 ↗</a></div>
      </div>
      <button class="close" onclick="closeModal()">✕</button>
    </div>
    <div class="sec"><h3>食材 ${ings.length} 项</h3><div class="ing">${ings.map(x=>`<span>${esc(x)}</span>`).join('')}</div></div>
    <div class="sec"><h3>做法 ${steps.length} 步</h3><ol class="steps">${steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>
    ${ad? `<div class="sec"><h3>广告位（按投放标签「${esc(ad.投放标签)}」匹配）</h3>
      <div class="ad"><img src="${esc(ad.封面图)}" alt="">
        <div><div class="t">${esc(ad.品类)} · ${esc(ad.店铺)}</div>
          <div class="n">${esc(ad.名称).slice(0,50)}</div>
          <div class="meta"><span class="price">¥${esc(ad['价格(元)'])}</span>
            ${ad.评论数?`<span>${esc(ad.评论数)} 条评价</span>`:''}
            <a href="${esc(ad.商品链接)}" target="_blank" style="color:#c8452d">去看看 ↗</a></div>
        </div></div></div>`:''}
  `;
  $('mask').classList.add('on');
}
function closeModal(){ $('mask').classList.remove('on'); }
$('mask').addEventListener('click',e=>{ if(e.target.id==='mask') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

$('grid').addEventListener('click',e=>{
  const card=e.target.closest('.card'); if(!card) return;
  if(card.dataset.rid) openRid(card.dataset.rid);
});

document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); state.view=b.dataset.v; $('q').value=''; render();
}));
let timer; $('q').addEventListener('input',()=>{ clearTimeout(timer); timer=setTimeout(render,150); });

load().catch(e=>{ $('hint').textContent='加载失败：'+e.message; });
</script>
</body>
</html>
